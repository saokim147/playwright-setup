# Parallel sharded test job: 4 pods, each runs one shard of the suite.
# Indexed completions expose JOB_COMPLETION_INDEX via the downward API,
# translated to --shard=N/4 at runtime.
apiVersion: batch/v1
kind: Job
metadata:
  name: playwright-test-runner
  namespace: qa-automation
  labels:
    app.kubernetes.io/name: playwright-tests
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 4
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playwright-tests
    spec:
      restartPolicy: Never
      containers:
        - name: playwright
          image: ghcr.io/OWNER/enterprise-playwright-framework:latest # build & push from docker/Dockerfile
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >
              SHARD=$((JOB_COMPLETION_INDEX + 1)) &&
              npx playwright test --project=$PW_PROJECT --shard=$SHARD/4 --reporter=line,blob
          envFrom:
            - configMapRef:
                name: playwright-config
            - secretRef:
                name: playwright-credentials
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: blob-report
              mountPath: /work/blob-report
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: blob-report
          emptyDir: {}
        - name: tmp
          emptyDir: {}
