services:
  tests:
    container_name: playwright-tests-ci
    command: ["--project=chromium", "--reporter=line,blob,html"]
    volumes: [] 
    shm_size: 512mb
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
        reservations:
          memory: 1g
    restart: "no"

  report-server:
    restart: "no"
